name: mobile_project
description: "Planify — adaptive planning, goals and shared progress."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/identity-source/approved-logo.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/branding/identity-source/Manrope.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/branding/identity-source/Inter.ttf
          weight: 400
        - asset: assets/branding/identity-source/Inter.ttf
          weight: 500
        - asset: assets/branding/identity-source/Inter.ttf
          weight: 600
